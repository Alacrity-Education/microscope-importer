name: Release

# Only "published" is used. A release that is created as a draft fires
# "created" immediately, while there is nothing to attach assets to yet, and a
# draft that is later published would fire a second time - so listening to
# "created" (or to "created" and "released" together) would run this workflow
# twice for the same release and once for a release that may never exist.
# "published" fires exactly once, both for a release published straight away
# and for a draft published later.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build, e.g. 0.2.0 or v0.2.0. Must match the package version in Cargo.toml of the ref you run this on."
        required: true
        type: string

permissions:
  contents: write

jobs:
  version:
    name: Derive and check the version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.derive.outputs.version }}
      tag: ${{ steps.derive.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: derive
        env:
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -eu
          if [ "$EVENT_NAME" = "release" ]; then
            RAW="$RELEASE_TAG"
          else
            RAW="$INPUT_VERSION"
          fi
          # v0.2.0 and 0.2.0 are both accepted.
          VERSION="${RAW#v}"
          case "$VERSION" in
            [0-9]*.[0-9]*) : ;;
            *)
              echo "::error::cannot read a version from '$RAW'; expected v1.2.3 or 1.2.3"
              exit 1
              ;;
          esac
          SOURCE="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[0].version')"
          if [ "$VERSION" != "$SOURCE" ]; then
            echo "::error::the release says $VERSION but Cargo.toml says $SOURCE. The source is the single source of truth and nothing is rewritten at build time: bump the package version, commit, and tag that commit."
            exit 1
          fi
          echo "building $VERSION from tag '$RAW'"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$RAW" >> "$GITHUB_OUTPUT"

  arch:
    name: Arch package
    needs: version
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # git has to be there before actions/checkout, and makepkg needs its
      # dependencies installed beforehand: "makepkg -s" would call pacman
      # through sudo from the unprivileged build user. makepkg also checks
      # the runtime depends (ffmpeg, udisks2, fontconfig); ffmpeg doubles as
      # the PKGBUILD's checkdepends. "rust" brings cargo and
      # rustc, the PKGBUILD's makedepends.
      - name: Install the toolchain
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git rust sudo ffmpeg udisks2 fontconfig github-cli

      - uses: actions/checkout@v4

      - name: Prepare the build user
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          useradd -m builder

      - name: Build the package
        run: |
          set -eu
          git archive --prefix="microscope-importer-$VERSION/" \
            -o "packaging/arch/microscope-importer-$VERSION.tar.gz" HEAD
          sed -i "s/^pkgver=.*/pkgver=$VERSION/" packaging/arch/PKGBUILD
          # makepkg refuses to run as root.
          chown -R builder:builder "$GITHUB_WORKSPACE"
          cd packaging/arch
          sudo -u builder makepkg -f --noconfirm

      - name: Inspect and install the package
        run: |
          set -eu
          cd packaging/arch
          pacman -Qip microscope-importer-"$VERSION"-1-x86_64.pkg.tar.zst
          pacman -U --noconfirm microscope-importer-"$VERSION"-1-x86_64.pkg.tar.zst
          microscope-importer --version
          microscope-importer --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: microscope-importer-arch-${{ needs.version.outputs.version }}
          path: packaging/arch/*.pkg.tar.zst
          if-no-files-found: error

      # Manual runs only build and keep the artifact; nothing is attached to a
      # release unless this run was started by publishing one.
      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" packaging/arch/*.pkg.tar.zst --clobber

  deb:
    name: Debian package
    needs: version
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
    env:
      VERSION: ${{ needs.version.outputs.version }}
      DEBIAN_FRONTEND: noninteractive
      DEBEMAIL: lucaci32u4@gmail.com
      DEBFULLNAME: lucaci32u4
    steps:
      - name: Install the toolchain
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts git curl ca-certificates ffmpeg gh

      # Trixie's rustc is exactly 1.85, the crate's minimum; build against the
      # same stable toolchain the developers use instead of living on that
      # edge. This is why debian/control build-depends on debhelper only and
      # why the build below passes -d.
      - name: Install Rust
        run: |
          curl https://sh.rustup.rs -sSf | sh -s -- -y --profile minimal
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - uses: actions/checkout@v4

      # dpkg-buildpackage only looks for ./debian, but the packaging lives in
      # packaging/debian next to the Arch PKGBUILD. Stage a copy for the build.
      - name: Stage the Debian packaging
        run: cp -a packaging/debian debian

      - name: Set the changelog version
        run: |
          set -eu
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          if [ "$(dpkg-parsechangelog -S Version)" = "$VERSION-1" ]; then
            echo "debian/changelog is already at $VERSION-1"
          else
            # --force-bad-version so that rebuilding an older tag works too.
            dch --newversion "$VERSION-1" --distribution unstable \
                --force-bad-version "Release $VERSION"
          fi
          dpkg-parsechangelog

      # -d because cargo comes from rustup and is not a dpkg-installed
      # build-dependency; see packaging/debian/README.Debian.
      - name: Build the package
        run: dpkg-buildpackage -us -uc -b -d

      - name: Collect and inspect the package
        run: |
          set -eu
          mkdir -p out
          mv ../microscope-importer_"$VERSION"-1_*.deb out/
          dpkg-deb -I out/microscope-importer_"$VERSION"-1_*.deb
          dpkg-deb -c out/microscope-importer_"$VERSION"-1_*.deb

      - name: Install the package
        run: |
          set -eu
          apt-get install -y --no-install-recommends ./out/microscope-importer_"$VERSION"-1_*.deb
          microscope-importer --version
          microscope-importer --help > /dev/null

      - uses: actions/upload-artifact@v4
        with:
          name: microscope-importer-deb-${{ needs.version.outputs.version }}
          path: out/*.deb
          if-no-files-found: error

      - name: Attach to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" out/*.deb --clobber
